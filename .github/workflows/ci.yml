name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m pip install build
      - run: python3 -m build
      - name: Install equilibrium-io 0.3.0
        run: python3 -m pip install "equilibrium-io @ git+https://github.com/12ff54e/equilibrium-io.git@674bdbbe404bb1c224c4922f20bae984bcc67a01"
      - run: python3 -m pip install dist/*.whl
      - name: Installed package and CLI
        env:
          MPLBACKEND: Agg
        run: |
          source_dir="$PWD"
          cd "$RUNNER_TEMP"
          equilibrium-plot --help
          python3 -m unittest discover -s "$source_dir/tests"
